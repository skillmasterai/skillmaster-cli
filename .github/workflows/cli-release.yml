# Publishing the CLI. The rules — which packages, what they are called, in which order they land
# and why only a formal tag uploads — are RELEASE.md §1–§7. This file implements
# them; when the two disagree, that document wins.
#
# **A tag is the only trigger.** Merging to main runs the tests (cli.yml) and publishes nothing:
# the release cadence and the merge cadence are separate decisions.
#
# **`-rc` tags build and do not upload.** That is how the pipeline is exercised without putting a
# prerelease on the download site, which only ever carries formal versions.
#
# **One pipeline, three channels, and the tag decides which.** The steps are identical; a channel
# is three values — the bucket prefix, the update address compiled into the binary, and whether the
# marker carries a revision:
#
# | tag                  | channel | prefix   | binary updates from      |
# |----------------------|---------|----------|--------------------------|
# | `cli/v1.6.3`         | live    | ``       | dl.skillmasterai.com     |
# | `cli/v1.6.3-beta.1`  | beta    | `/beta`  | dl.skillmasterai.com/beta|
# | `cli/v1.6.3-test`    | test    | `/_test` | dl.skillmasterai.com     |
# | `cli/v1.6.3-rc.1`    | none    | —        | built, not published     |
#
# `workflow_dispatch` is the rehearsal without a tag.
#
# **Why one file.** The beta channel used to be `cli-beta.yml`, a 446-line copy of this one. Two
# copies of the upload path means every fix has to be made twice: on 2026-11-18 the ACL fix landed
# in both, and had it landed in one, the other channel would have gone on publishing objects that
# answer 403 while its own run stayed green. A rehearsal is this file with a prefix, and so is
# beta.
name: CLI release

on:
  push:
    tags:
      - 'cli/v*'
  # No inputs on purpose: a dispatch cannot ask to publish, and a rehearsal cannot be mistaken for
  # one in the Actions list — the version it prints starts with `0.0.0-test`.
  workflow_dispatch:

permissions:
  contents: read


env:
  # §6: one bucket, one endpoint, and the artifact names carry no version, so the download URLs
  # never change. The values are here rather than in a secret because they are not sensitive; the
  # credentials are.
  OSS_BUCKET: skillmaster-dl
  # The downloads' public front (`dl.` proxies the bucket). Compiled into the binary (v25): a
  # release updates itself from the channel it belongs to, and the formal channel is the root
  # (ADR 0103).
  UPDATE_BASE: https://dl.skillmasterai.com

jobs:
  build:
    name: Build every package
    runs-on: ubuntu-latest
    # The signing key lives in this environment, behind a required reviewer: a commit that
    # reaches main still cannot read it without a person approving the run. The tag run waits
    # for that approval before it builds anything.
    environment: release
    # `id-token` is what lets cosign sign with the workflow's own OIDC identity and what
    # `actions/attest-build-provenance` turns into a build-provenance attestation;
    # `attestations: write` is where that attestation is stored.
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      # `live`, `beta`, `test`, or `none` for a prerelease build that is not published.
      channel: ${{ steps.version.outputs.channel }}
      # Only beta builds carry it: the beta version string is fixed across builds, so the commit is
      # what tells two of them apart.
      revision: ${{ steps.version.outputs.revision }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # The ancestry check below needs the real history, not the single tagged commit.
          fetch-depth: 0

      # §2: a tag that is not in main's history is refused. Otherwise a release can be cut from the
      # middle of a branch, and the thing users download has never been reviewed as a whole.
      - name: The tag is on main
        if: github.event_name == 'push'
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME is not an ancestor of main — release from main only"
            exit 1
          fi

      - name: Read the version
        id: version
        run: |
          # A dispatch has no tag to read: it is a rehearsal of this file, so it takes a version
          # that cannot be mistaken for a release.
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            version="0.0.0-test.${GITHUB_RUN_NUMBER}"
            {
              echo "version=$version"
              echo "channel=test"
            } >> "$GITHUB_OUTPUT"
            echo "$version is a rehearsal: it publishes under \`_test/\` and the live site never sees it." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          version="${GITHUB_REF_NAME#cli/v}"
          if [ -z "$version" ] || [ "$version" = "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not carry a version (expected cli/v1.2.3)"
            exit 1
          fi
          # §2 names exactly three shapes. "Contains a hyphen" is broader than that: a tag like
          # `cli/v1.0.1-fix` would build, print one log line, skip the upload and exit green — a
          # release that never was, indistinguishable in the Actions list from one that shipped.
          # A rehearsal tag carries the version it is rehearsing plus `-test`, and it runs the whole
          # publish job under `_test/`. `cli/v1.6.2-test` is how the next real release is tried
          # without spending the number or touching a live key.
          if printf '%s' "$version" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+-test(\.[0-9]+)?$'; then
            echo "version=$version" >> "$GITHUB_OUTPUT"
            echo "channel=test" >> "$GITHUB_OUTPUT"
            echo "$version is a rehearsal: it publishes under \`_test/\` and the live site never sees it." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # A beta tag is a published build for testers. The version names the line; the commit
          # names the build, and both go into `--version` and the channel marker.
          if printf '%s' "$version" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+-beta(\.[0-9]+)?$'; then
            revision="${GITHUB_SHA:0:7}"
            {
              echo "version=$version"
              echo "channel=beta"
              echo "revision=$revision"
            } >> "$GITHUB_OUTPUT"
            echo "$version ($revision) goes to the beta channel." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if ! printf '%s' "$version" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$'; then
            echo "::error::$version is not a version — RELEASE.md §2 allows cli/v1.2.3, cli/v1.2.3-rc.1 and cli/v1.2.3-test"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          case "$version" in
            *-rc.*)
              echo "channel=none" >> "$GITHUB_OUTPUT"
              echo "$version is a prerelease: it is built and kept as an artifact, not published." >> "$GITHUB_STEP_SUMMARY" ;;
            *)
              echo "channel=live" >> "$GITHUB_OUTPUT"
              echo "$version will be published to the download site." >> "$GITHUB_STEP_SUMMARY" ;;
          esac

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      # **Beta builds run the tests here.** Since beta builds are cut by a tag, main has already run
      # them — but a tag can point at a commit from last week, and a beta is installed by people and
      # left running for days. A rehearsal does not need them: it publishes where nothing reads.
      - name: The tests pass on this commit
        if: steps.version.outputs.channel == 'beta'
        run: go test ./...

      # §3, §4: six packages, names without a version. The version lives in the binary and is
      # printed by `--version`; a name that carried it would break every download URL on release.
      # **The server address is compiled in, and it is the one the server publishes.** `config`
      # defaults to `http://localhost:8080` on purpose — a default that pointed at production
      # would let one slip of a command hand a credential to the wrong server — so a release that
      # forgets to overwrite it is a binary that talks to nobody. It reads the same repository
      # variable the deployment renders into `SKILLMASTER_PUBLIC_BASE_URL`, so the address the CLI
      # dials and the `issuer` the server claims cannot drift apart: they are one value.
      - name: Cross-compile and package
        working-directory: .
        env:
          VERSION: ${{ steps.version.outputs.version }}
          CHANNEL: ${{ steps.version.outputs.channel }}
          REVISION: ${{ steps.version.outputs.revision }}
          SERVER: ${{ vars.SKILLMASTER_PUBLIC_BASE_URL }}
        run: |
          set -euo pipefail
          if [ -z "$SERVER" ]; then
            echo "::error::vars.SKILLMASTER_PUBLIC_BASE_URL is empty — a release built without it talks to localhost"
            exit 1
          fi
          echo "the binary will dial $SERVER"
          # **The update channel is compiled in** (ADR 0103): a beta tester's binary cannot be moved
          # onto the formal track by a file on the server, and a formal binary cannot be left on the
          # beta one. A rehearsal compiles the formal address, because that is what the release it
          # rehearses will carry.
          update_base="$UPDATE_BASE"
          [ "$CHANNEL" = beta ] && update_base="$UPDATE_BASE/beta"
          echo "the binary will update from $update_base"
          # One string, appended line by line: `go build -ldflags` splits on whitespace, and a
          # value carrying a newline or leading indentation is a thing to find out about in CI.
          ldflags="-s -w"
          ldflags="$ldflags -X github.com/skillmasterai/skillmaster-cli/internal/version.Version=${VERSION}"
          ldflags="$ldflags -X github.com/skillmasterai/skillmaster-cli/internal/config.DefaultServer=${SERVER}"
          ldflags="$ldflags -X github.com/skillmasterai/skillmaster-cli/internal/version.UpdateBase=${update_base}"
          # Empty for every channel but beta; `--version` prints `(revision)` only when it is set.
          [ -n "$REVISION" ] && ldflags="$ldflags -X github.com/skillmasterai/skillmaster-cli/internal/version.Revision=${REVISION}"
          # Absolute paths, because two of the three commands below change directory: a
          # relative archive name means one thing here and another inside `( cd … )`. The
          # first rehearsal shipped the tar files to the repository root and the zips to
          # `dist/`, and the checksum step then found nothing (cli/v1.0.0-rc1).
          root="$GITHUB_WORKSPACE"
          build="$root/.build"
          dist="$root/dist"
          mkdir -p "$build" "$dist"

          for target in darwin/arm64 darwin/amd64 linux/amd64 linux/arm64 windows/amd64 windows/arm64; do
            os="${target%/*}"; arch="${target#*/}"
            ext=""; [ "$os" = windows ] && ext=".exe"
            out="$build/${os}-${arch}"
            mkdir -p "$out"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
              go build -trimpath -ldflags "$ldflags" -o "${out}/skmr${ext}" ./cmd/skillmaster

            name="skillmaster_${os}_${arch}"
            if [ "$os" = windows ]; then
              (cd "$out" && zip -q -9 "$dist/${name}.zip" "skmr.exe")
            else
              # `-C <dir> skmr` puts the binary at the archive root — install.sh copies
              # `$tmp/skmr` after extracting, so a wrapping directory would break it.
              tar -czf "$dist/${name}.tar.gz" -C "$out" skmr
            fi
            echo "built ${name}"
          done

      # §6: the checksum file describes the six packages **and the two install scripts**, and it is
      # uploaded before the install scripts so a script that can be fetched can already be
      # verified. Without the scripts' own hashes, "verify the download" would leave out the one
      # file that gets executed first.
      # **The skill package travels with the release.** A user behind a network that cannot reach
      # GitHub, on a machine with no Node, still needs a verified way to get the skill. Publishing
      # the archive here puts it under `checksums.txt` — and therefore under the attestation and
      # both signatures — instead of leaving the bucket serving a copy built somewhere else.
      #
      # The ref is pinned: a floating `main` would let the bytes behind a version change after it
      # was signed. Bumping it is a pull request, reviewed like any other change.
      - name: Pack the skill
        env:
          SKILLS_COMMIT: 7a9de7941029f9badc8563da10ab6d620234ef63
        run: |
          set -euo pipefail
          printf '%s' "$SKILLS_COMMIT" | grep -Eq '^[0-9a-f]{40}$' ||
            { echo "::error::SKILLS_COMMIT is not a full commit sha"; exit 1; }
          url="https://raw.githubusercontent.com/skillmasterai/skillmaster-skills/${SKILLS_COMMIT}/skills/skillmaster/SKILL.md"
          tmp="$RUNNER_TEMP/skill"
          rm -rf "$tmp"; mkdir -p "$tmp/skillmaster"
          curl --proto '=https' --proto-redir '=https' -fsSL --retry 3 --retry-delay 2 "$url" \
            -o "$tmp/skillmaster/SKILL.md"
          # One file, and it starts with the frontmatter the agent reads. A 404 page saved as
          # SKILL.md would otherwise ship as a valid-looking archive.
          [ "$(find "$tmp/skillmaster" -type f | wc -l | tr -d ' ')" -eq 1 ]
          head -n 1 "$tmp/skillmaster/SKILL.md" | grep -qx -- '---'
          # Deterministic: the same bytes in produce the same archive out, on any day.
          tar --sort=name --mtime=@0 --owner=0 --group=0 --numeric-owner \
            -czf "$GITHUB_WORKSPACE/dist/skillmaster.tgz" -C "$tmp" skillmaster
          sha256sum "$GITHUB_WORKSPACE/dist/skillmaster.tgz"
      - name: Checksums
        working-directory: dist
        run: |
          set -euo pipefail
          ls -1 skillmaster_*.tar.gz skillmaster_*.zip skillmaster.tgz > /dev/null
          sha256sum skillmaster_*.tar.gz skillmaster_*.zip skillmaster.tgz > checksums.txt
          ( cd "$GITHUB_WORKSPACE/install" && sha256sum install.sh install.ps1 ) >> checksums.txt
          cat checksums.txt

      # **Two independent signatures over one file.** cosign binds `checksums.txt` to this
      # workflow's GitHub OIDC identity and records it in Sigstore's public transparency log;
      # minisign lets a machine verify the same bytes offline, against a public key that does not
      # need GitHub, Sigstore, or a network round trip. Neither one replaces the other.
      - name: Sign the checksums (cosign keyless)
        uses: sigstore/cosign-installer@v3

      - name: Sign the checksums with cosign
        run: |
          set -euo pipefail
          cosign sign-blob --yes --bundle dist/checksums.txt.sigstore.json dist/checksums.txt

      - name: Sign the checksums with minisign
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${MINISIGN_SECRET_KEY:-}" ]; then
            echo "::error::MINISIGN_SECRET_KEY is empty — refusing to publish an unsigned release"
            exit 1
          fi
          # **The runner's apt mirror sometimes goes dark.** `apt-get update` has no per-request
          # timeout, so it hangs until our own `timeout` kills it — exit 124, twice on 2026-11-18,
          # each time costing an approved release a run. Ask the image first (it often already has
          # the tool) and give the network three short attempts instead of one long one.
          install_pkg() {
            if command -v "$1" >/dev/null 2>&1; then echo "$1 is already installed"; return 0; fi
            for attempt in 1 2 3; do
              if timeout 90 sudo apt-get update -qq && timeout 120 sudo apt-get install -y -qq "$1"; then
                return 0
              fi
              echo "$1: apt attempt $attempt of 3 failed; retrying in 10s"
              sleep 10
            done
            echo "::error::could not install $1 in three attempts — the runner could not reach its mirror"
            return 1
          }
          install_pkg minisign
          install -d "$RUNNER_TEMP/minisign"
          printf '%s' "$MINISIGN_SECRET_KEY" > "$RUNNER_TEMP/minisign/minisign.key"
          chmod 600 "$RUNNER_TEMP/minisign/minisign.key"
          minisign -S -s "$RUNNER_TEMP/minisign/minisign.key" \
            -x dist/checksums.txt.minisig -m dist/checksums.txt \
            -t "skillmaster ${{ steps.version.outputs.version }}"
          minisign -V -p minisign.pub -x dist/checksums.txt.minisig -m dist/checksums.txt
          cp minisign.pub dist/minisign.pub

      # **Provenance, not a signature.** This says the files were built by this workflow from this
      # commit in this public repository; `gh attestation verify <file> --repo` checks it. The
      # signatures above say the release was signed; this says how the bytes came to exist.
      - name: Attest the release artifacts
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/skillmaster_*.tar.gz
            dist/skillmaster_*.zip
            dist/skillmaster.tgz
            dist/checksums.txt
            dist/checksums.txt.sigstore.json
            dist/checksums.txt.minisig
            dist/minisign.pub
            install/install.sh
            install/install.ps1

      # The build exiting 0 does not mean the address went in: `-X` names a symbol, and a symbol
      # that does not exist is not an error. Ask the built binary instead of the command that
      # built it.
      - name: The binary carries the server address
        env:
          VERSION: ${{ steps.version.outputs.version }}
          CHANNEL: ${{ steps.version.outputs.channel }}
          REVISION: ${{ steps.version.outputs.revision }}
          SERVER: ${{ vars.SKILLMASTER_PUBLIC_BASE_URL }}
        run: |
          set -euo pipefail
          tar -xzf dist/skillmaster_linux_amd64.tar.gz -C "$RUNNER_TEMP"
          if ! grep -qaF "$SERVER" "$RUNNER_TEMP/skmr"; then
            echo "::error::skillmaster_linux_amd64 does not carry $SERVER — the ldflag did not take"
            exit 1
          fi
          # **The update channel, for the same reason.** A binary without it never updates and
          # never says why: "no new version" and "this build cannot update" look identical.
          update_base="$UPDATE_BASE"
          [ "$CHANNEL" = beta ] && update_base="$UPDATE_BASE/beta"
          if ! grep -qaF "$update_base" "$RUNNER_TEMP/skmr"; then
            echo "::error::skillmaster_linux_amd64 does not carry $update_base — it would never update itself"
            exit 1
          fi
          # **A beta is identified by its commit.** The version string is the same across the line,
          # so a build whose revision did not take prints a version that names no build at all.
          if [ "$CHANNEL" = beta ]; then
            printed="$("$RUNNER_TEMP/skmr" --version)"
            echo "$printed"
            case "$printed" in
              "skmr ${VERSION} (${REVISION}) (API "*) ;;
              *) echo "::error::--version printed '$printed', expected it to name both $VERSION and $REVISION"; exit 1 ;;
            esac
          fi
          echo "linux/amd64 carries $SERVER and $update_base"

      - name: Keep the packages
        uses: actions/upload-artifact@v4
        with:
          name: cli-packages
          path: dist/*
          if-no-files-found: error

  publish:
    name: Upload the formal version
    needs: build
    # A rehearsal publishes nowhere the site reads, but it is the upload path that is being tested,
    # so it runs the same job. Everything below is written once and prefixed by `ROOT`.
    if: needs.build.outputs.channel != 'none'
    runs-on: ubuntu-latest
    # **The upload is behind the same gate as the signing key.** Without this line the production
    # write path (bucket credentials, the objects the site serves) ran outside the protected
    # environment: anyone able to edit `main` could publish without a reviewer, and the write
    # credentials could not be environment-scoped. The same tag answers the same question twice —
    # GitHub approves per job, so this job asks for its own approval after `build`.
    environment: release
    # Creating the GitHub Release that mirrors these bytes needs to write to the repository; that is
    # the only repository write this job performs, and it is scoped to this job.
    permissions:
      contents: write
    # **Publish runs queue; builds do not.** The keys carry no version, so two publish jobs at once
    # can interleave one version's packages with another's checksums.txt and each can still pass its
    # own check. Scoped to this job because a prerelease build has nothing to collide with.
    #
    # **This serialises, it does not guarantee everything ships.** GitHub keeps one pending run per
    # group and cancels the pending one when a newer arrives, so two formal tags pushed back to back
    # can leave the first of them unpublished — and since the site only moves forward, that version
    # is then skipped for good. Push formal tags one at a time.
    concurrency:
      group: cli-release-publish
      cancel-in-progress: false
    env:
      VERSION: ${{ needs.build.outputs.version }}
      # **The channel is one prefix.** `''` is the live site, `/_test` a rehearsal, `/beta` the
      # beta channel — and every path below is written once, as `${ROOT}/...`. The rehearsal and the
      # beta channel get the live layout one level down, so the same steps run unchanged and
      # nothing the site serves can move.
      ROOT: ${{ needs.build.outputs.channel == 'beta' && '/beta' || (needs.build.outputs.channel == 'test' && '/_test' || '') }}
      REVISION: ${{ needs.build.outputs.revision }}
      # rclone's S3 backend speaks OSS's S3-compatible endpoint, under a remote named `dl`.
      #
      # **`dl:path`, never `:dl:path`.** The leading colon is rclone's connection-string form, and
      # its first field is a *backend type* (`:s3,provider=Alibaba:path`) — `dl` is a remote *name*,
      # so `:dl:` dies with `didn't find backend called "dl"` even when the config is correct. That
      # was the first formal release's actual failure (2026-10-26), and it is why the same message
      # appeared before and after the config file was added.
      #
      # **A config file, not `RCLONE_CONFIG_DL_*`.** Those variables only override values of a
      # remote that already exists; with no config file `rclone config dump` prints `{}`. The file
      # goes to rclone's default path (`$HOME/.config/rclone`), which needs no variable — and
      # `runner` is not an allowed context in a job-level `env` anyway (that mistake made the whole
      # workflow file invalid). The runner's home dies with the runner.
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # The Gitee mirror pushes this history; a depth-1 clone cannot be pushed.
          fetch-depth: 0

      - name: Fetch the packages
        uses: actions/download-artifact@v4
        with:
          name: cli-packages
          path: dist

      - name: Install rclone
        run: |
          set -euo pipefail
          # **The distro package, not a downloaded zip.** A zip from downloads.rclone.org had no
          # checksum or signature; this binary then ran as root and received the release bucket
          # credentials. apt's archive is signed by the distribution, and the runner image does
          # not always ship rclone, so this is the one path that is both available and verifiable.
          # **The runner's apt mirror sometimes goes dark.** `apt-get update` has no per-request
          # timeout, so it hangs until our own `timeout` kills it — exit 124, twice on 2026-11-18,
          # each time costing an approved release a run. Ask the image first (it often already has
          # the tool) and give the network three short attempts instead of one long one.
          install_pkg() {
            if command -v "$1" >/dev/null 2>&1; then echo "$1 is already installed"; return 0; fi
            for attempt in 1 2 3; do
              if timeout 90 sudo apt-get update -qq && timeout 120 sudo apt-get install -y -qq "$1"; then
                return 0
              fi
              echo "$1: apt attempt $attempt of 3 failed; retrying in 10s"
              sleep 10
            done
            echo "::error::could not install $1 in three attempts — the runner could not reach its mirror"
            return 1
          }
          install_pkg rclone
          rclone version | head -1

      # **A config file, because an environment variable cannot create a remote.** `RCLONE_CONFIG_*`
      # only override values of a remote that already exists; with no config file rclone has nothing
      # to override. `umask 077` keeps the key unreadable to anyone else on the runner, and the file
      # dies with the runner. `listremotes` at the end is the assertion that `dl:` exists — the next
      # step is the first thing that would fail without it, and it fails with a message about
      # backends rather than about the bucket.
      - name: Point rclone at the download bucket
        env:
          ACCESS_KEY_ID: ${{ secrets.OSS_DL_ACCESS_KEY_ID }}
          ACCESS_KEY_SECRET: ${{ secrets.OSS_DL_ACCESS_KEY_SECRET }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$HOME/.config/rclone"
          cat > "$HOME/.config/rclone/rclone.conf" <<EOF
          [dl]
          type = s3
          provider = Alibaba
          access_key_id = ${ACCESS_KEY_ID}
          secret_access_key = ${ACCESS_KEY_SECRET}
          endpoint = https://oss-cn-hangzhou.aliyuncs.com
          EOF
          rclone listremotes

      # **The site never moves backwards.** The keys carry no version, so re-running an old tag's
      # publish job — "Re-run failed jobs" on last week's run — replaces every package with that
      # older build and passes its own check, because local and remote agree. `version.txt` is the
      # one object that remembers which release the site is actually serving.
      - name: Refuse to replace a newer published version
        run: |
          set -euo pipefail
          # A rehearsal has no live marker to defend: its `version.txt` lives under `_test/` and is
          # written by the same step below.
          if [ -n "$ROOT" ]; then echo "rehearsal: the live version marker is not involved"; exit 0; fi
          base="https://${OSS_BUCKET}.oss-cn-hangzhou.aliyuncs.com"
          # **Only a 404 means "no marker yet".** `if ! curl …` treated every failure as absent —
          # a DNS blip or one 503 would have switched the guard off and let an old tag overwrite
          # the site while the log said "first formal release".
          code="$(curl -sS --retry 5 --retry-delay 3 -o /tmp/version.txt -w '%{http_code}' "$base/version.txt")"
          case "$code" in
            404) echo "no version.txt yet — this is the first formal release"; exit 0 ;;
            200) ;;
            *)   echo "::error::cannot read $base/version.txt (HTTP $code) — refusing to publish blind"; exit 1 ;;
          esac
          published="$(cat /tmp/version.txt)"
          case "$published" in
            ''|[0-9]*.[0-9]*) ;;
            *) echo "::error::the published marker holds '$published', which is not a version — fix $base/version.txt"; exit 1 ;;
          esac
          echo "the site currently serves $published; this tag is $VERSION"
          if [ "$published" = "$VERSION" ]; then
            echo "re-publishing the same version"
            exit 0
          fi
          newest="$(printf '%s\n%s\n' "$published" "$VERSION" | sort -V | tail -1)"
          if [ "$newest" != "$VERSION" ]; then
            echo "::error::$VERSION is older than the $published already published — re-running an old tag must not move the site backwards"
            exit 1
          fi

      # **Nothing touches a live key until every object is in the bucket.** The keys carry no
      # version, so an upload that dies half way leaves the site serving one release's packages
      # beside another's checksums.txt — and every installer on the replaced platforms refuses with
      # "校验和不符" until somebody re-runs the job. Staging under `releases/<version>/` means a bad
      # build is discovered before the first live object moves.
      #
      # Promotion is still object by object: S3 has no multi-object commit, so the window shrinks
      # rather than closes. It is short, it fails closed (the installers check checksums), and
      # re-running the same tag repairs it — which is why the version guard allows that one case.
      - name: Stage every object under releases/<version>/
        run: |
          set -euo pipefail
          # **`--s3-no-check-bucket` on every write.** Without it rclone asks whether the bucket
          # exists before uploading, and when that answer is a denial rather than a "no" it tries
          # to *create* the bucket — which OSS answers with `409 BucketAlreadyExists` (2026-10-26,
          # seventh release attempt). The uploader knows the bucket exists; the check is a read
          # permission the release key has no reason to hold.
          staging="dl:${OSS_BUCKET}${ROOT}/releases/${VERSION}"
          for f in dist/skillmaster_*.tar.gz dist/skillmaster_*.zip dist/skillmaster.tgz dist/checksums.txt \
                   dist/checksums.txt.sigstore.json dist/checksums.txt.minisig dist/minisign.pub \
                   install/install.sh install/install.ps1; do
            rclone copyto --s3-no-check-bucket --retries 3 --s3-acl public-read --header-upload "Cache-Control: no-cache" \
              "$f" "$staging/$(basename "$f")"
          done
          rclone lsf --s3-no-check-bucket "$staging" | sort

      - name: The staging area holds all thirteen objects
        run: |
          set -euo pipefail
          base="https://${OSS_BUCKET}.oss-cn-hangzhou.aliyuncs.com${ROOT}/releases/${VERSION}"
          for f in dist/skillmaster_*.tar.gz dist/skillmaster_*.zip dist/skillmaster.tgz; do
            name="$(basename "$f")"
            curl -fsSL --retry 5 --retry-delay 3 -o "/tmp/$name" "$base/$name"
            want="$(awk -v n="$name" '$2 == n { print $1 }' dist/checksums.txt)"
            got="$(sha256sum "/tmp/$name" | awk '{ print $1 }')"
            [ "$want" = "$got" ] || { echo "::error::staged $name differs from checksums.txt"; exit 1; }
          done
          for name in checksums.txt checksums.txt.sigstore.json checksums.txt.minisig \
                      minisign.pub install.sh install.ps1; do
            curl -fsSL --retry 5 --retry-delay 3 -o "/tmp/$name" "$base/$name"
          done
          cmp /tmp/checksums.txt dist/checksums.txt
          cmp /tmp/checksums.txt.sigstore.json dist/checksums.txt.sigstore.json
          cmp /tmp/checksums.txt.minisig dist/checksums.txt.minisig
          cmp /tmp/minisign.pub dist/minisign.pub
          cmp /tmp/install.sh install/install.sh
          cmp /tmp/install.ps1 install/install.ps1
          for name in install.sh install.ps1; do
            want="$(awk -v n="$name" '$2 == n { print $1 }' dist/checksums.txt)"
            got="$(sha256sum "install/$name" | awk '{ print $1 }')"
            [ "$want" = "$got" ] || { echo "::error::staged $name differs from checksums.txt"; exit 1; }
          done
          echo "the staging area is complete and byte-identical to the build"

      # §6, in order: the six packages, then checksums.txt, then the two scripts, then the marker.
      # A reader that receives a checksum always has the thing it describes; a script that can be
      # fetched can always be verified; and the version marker is written only once everything it
      # vouches for is in place.
      - name: Promote the staged objects to the live keys
        run: |
          set -euo pipefail
          staging="dl:${OSS_BUCKET}${ROOT}/releases/${VERSION}"
          # The thirteen objects, in §6's order, in one place: the promote loop, the header check and
          # the repair all have to mean the same thirteen or the check is a spot check.
          objects() {
            printf '%s\n' dist/skillmaster_*.tar.gz dist/skillmaster_*.zip dist/skillmaster.tgz dist/checksums.txt \
              dist/checksums.txt.sigstore.json dist/checksums.txt.minisig dist/minisign.pub \
              install/install.sh install/install.ps1
          }
          promote_from_staging() {
            # **From the local artifact, not a server-side copy of the staging object.** A copy
            # carries no upload headers, so neither `Cache-Control` nor the object ACL would be
            # set — and through the S3-compatible API a new object defaults to private, which
            # makes every published URL answer 403 (2026-11-18, cli/v1.6.0).
            while IFS= read -r f; do
              name="$(basename "$f")"
              rclone copyto --s3-no-check-bucket --retries 3 --ignore-times --s3-acl public-read \
                --header-upload "Cache-Control: no-cache" \
                \
                "$f" "dl:${OSS_BUCKET}${ROOT}/$name"
            done < <(objects)
          }
          # Prints "<http status> <Cache-Control value>". The status travels with the value because
          # a request that could not be answered and a copy that dropped the header are different
          # facts, and only the second is repaired by uploading again. The field is split on the
          # colon and trimmed, so a value serialised without a space after it still reads.
          cache_of() {
            : > /tmp/cache.headers
            code="$(curl -sSI -o /tmp/cache.headers -w '%{http_code}' --retry 5 --retry-delay 3 \
              "https://${OSS_BUCKET}.oss-cn-hangzhou.aliyuncs.com${ROOT}/$1")" || code=000
            value="$(tr -d '\r' < /tmp/cache.headers |
              awk -F':' 'tolower($1)=="cache-control"{ sub(/^[ \t]+/, "", $2); print $2 }')" || value=""
            printf '%s %s\n' "${code:-000}" "$value"
          }

          promote_from_staging

          # **The copy is not trusted to keep the header.** On 2026-10-26 it preserved
          # `Cache-Control` for the seven packages and dropped it for the two scripts — one loop,
          # same call, two different outcomes — because metadata handling belongs to OSS's
          # compatibility layer rather than to this workflow. `no-cache` is what keeps an unchanged
          # URL from serving the previous build, so every live object is asked, not just install.sh
          # (a spot check passed on the object that had kept it and said nothing about the others).
          #
          # **`--ignore-times` is what makes the repair real.** Without it rclone compares size and
          # mtime, finds the object it has just copied identical, and skips the upload — which is
          # how the 1.0.1 repair silently did nothing and the run failed on a second identical
          # check. The whole block runs **before** `version.txt`, so a failure here leaves the
          # marker behind and the same tag can be re-run to finish.
          lost=()
          while IFS= read -r f; do
            read -r cache_status cache_value <<< "$(cache_of "$(basename "$f")")"
            case "$cache_status:$cache_value" in
              200:*no-cache*) ;;
              200:*) lost+=("$f") ;;
              *) echo "::error::cannot read Cache-Control from $(basename "$f"): HTTP $cache_status"; exit 1 ;;
            esac
          done < <(objects)

          if [ "${#lost[@]}" -gt 0 ]; then
            echo "${#lost[@]} object(s) lost Cache-Control in the copy; re-uploading them from the checkout"
            for f in "${lost[@]}"; do
              rclone copyto --s3-no-check-bucket --retries 3 --ignore-times --s3-acl public-read \
                --header-upload "Cache-Control: no-cache" \
                "$f" "dl:${OSS_BUCKET}${ROOT}/$(basename "$f")"
            done
            for f in "${lost[@]}"; do
              read -r cache_status cache_value <<< "$(cache_of "$(basename "$f")")"
              case "$cache_status:$cache_value" in
                200:*no-cache*) ;;
                200:*) echo "::error::$(basename "$f") still has no Cache-Control after re-uploading"; exit 1 ;;
                *) echo "::error::cannot read Cache-Control from $(basename "$f") after re-uploading: HTTP $cache_status"; exit 1 ;;
              esac
            done
          fi
          echo "Cache-Control: no-cache is on all thirteen live objects"

          # The beta version string is the same across the line, so the marker carries the build.
          marker_text="$VERSION"
          [ "$ROOT" = /beta ] && marker_text="$VERSION ($REVISION)"
          printf '%s\n' "$marker_text" > /tmp/version.txt
          rclone copyto --s3-no-check-bucket --retries 3 --s3-acl public-read --header-upload "Cache-Control: no-cache" \
            /tmp/version.txt "dl:${OSS_BUCKET}${ROOT}/version.txt"

          # **Ask the marker, do not assume the write worked.** Everything above is already live;
          # if the marker did not land, the next release would read a stale version and a re-run of
          # that older tag would be accepted. Failing here says so in the run that caused it.
          #
          # The status is read on its own line: under `set -e`, `curl -f` on a missing marker ends
          # the step with curl's own error — which is exactly the case this message explains.
          marker_status="$(curl -sS -o /tmp/marker -w '%{http_code}' --retry 5 --retry-delay 3 \
            "https://${OSS_BUCKET}.oss-cn-hangzhou.aliyuncs.com${ROOT}/version.txt")" || marker_status=000
          marker="$(cat /tmp/marker 2>/dev/null || true)"
          if [ "$marker_status" != "200" ] || [ "$marker" != "$marker_text" ]; then
            echo "::error::the thirteen objects are live but ${ROOT:+$ROOT/}version.txt answers HTTP $marker_status and says '$marker' instead of '$marker_text'; re-run this tag to finish"
            exit 1
          fi

      # The release is not "done" because the upload exited 0 — ask the bucket what it serves, and
      # check the bytes against the checksum file that was just published.
      #
      # **The bucket's own endpoint, not `dl.skillmasterai.com`** (2026-10-26). `dl.` is an nginx
      # proxy on the ECS, and a GitHub runner's TLS to that host was reset between ClientHello and
      # ServerHello before the ICP filing — the same thing that made console.yml move its probe
      # onto the host. A formal release would have gone red at its last step *after* the files had
      # landed, so the "release succeeded" signal would never exist. Read-back stays on the bucket
      # because the bucket is the origin; the proxied name is asked from the host instead, in the
      # step after this one.
      - name: The bucket serves what was just published
        run: |
          set -euo pipefail
          base="https://${OSS_BUCKET}.oss-cn-hangzhou.aliyuncs.com${ROOT}"
          for f in dist/skillmaster_*.tar.gz dist/skillmaster_*.zip dist/skillmaster.tgz; do
            name="$(basename "$f")"
            curl -fsSL --retry 5 --retry-delay 3 -o "/tmp/$name" "$base/$name"
            want="$(awk -v n="$name" '$2 == n { print $1 }' dist/checksums.txt)"
            got="$(sha256sum "/tmp/$name" | awk '{ print $1 }')"
            [ "$want" = "$got" ] || { echo "::error::$name differs from checksums.txt at $base"; exit 1; }
          done

          # The one file standing between every user and a wrong binary is checksums.txt, and it
          # was the only published artifact this job never read back. `install.sh` fetches it from
          # the same origin as the package, so a truncated or stale copy breaks every install while
          # the six packages below are perfect.
          for name in checksums.txt checksums.txt.sigstore.json checksums.txt.minisig \
                      minisign.pub install.sh install.ps1; do
            curl -fsSL --retry 5 --retry-delay 3 -o "/tmp/$name" "$base/$name"
          done
          cmp /tmp/checksums.txt dist/checksums.txt
          cmp /tmp/checksums.txt.sigstore.json dist/checksums.txt.sigstore.json
          cmp /tmp/checksums.txt.minisig dist/checksums.txt.minisig
          cmp /tmp/minisign.pub dist/minisign.pub
          cmp /tmp/install.sh install/install.sh
          cmp /tmp/install.ps1 install/install.ps1
          echo "all six packages, checksums.txt and both installers are served byte for byte"

      # The public repository must not carry the production SSH key. The object is verified
      # through the bucket endpoint, which the runner can reach; nginx and its certificate
      # are checked by the server repository's host check.
      - name: The bucket serves the published installer
        run: |
          set -euo pipefail
          url="https://${OSS_BUCKET}.oss-cn-hangzhou.aliyuncs.com${ROOT}/install.sh"
          curl -fsS --retry 10 --retry-delay 2 -o /dev/null "$url"
          echo "the bucket serves install.sh"
          curl -fsS --retry 10 --retry-delay 2 -o /dev/null "$url"
          echo "the bucket serves install.sh"

      # **The same bytes at a second origin, for readers with no tools.** Every other proof on the
      # install page needs something installed: minisign, cosign, or `gh`. A reader with none of
      # them can still fetch `checksums.txt` from the download site and from this release and
      # compare the two — nothing but `curl` and `cmp` (or `Invoke-WebRequest` on Windows). That
      # answers a narrower question than a signature ("do the two origins agree?"), and it is the
      # only one that reader can ask; serving them different bytes now takes both the bucket and
      # this repository.
      #
      # A rehearsal stays out: its tag is not a release anyone should download.
      - name: Publish the same files as a GitHub Release
        if: needs.build.outputs.channel != 'test'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          files=(
            dist/skillmaster_*.tar.gz
            dist/skillmaster_*.zip
            dist/skillmaster.tgz
            dist/checksums.txt
            dist/checksums.txt.sigstore.json
            dist/checksums.txt.minisig
            dist/minisign.pub
            install/install.sh
            install/install.ps1
          )
          notes="The same bytes as https://dl.skillmasterai.com. On a machine with no minisign, no cosign and no gh: download checksums.txt from both places and compare them."
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            # Re-running a tag is how a half-finished publication is repaired; the assets follow.
            gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${files[@]}" \
              --title "$VERSION" --notes "$notes" --verify-tag
          fi
          gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name' | sort

      # **The same manifest at an origin that is reachable from mainland China.** The two-origin
      # check is only worth writing down if the reader can open the second origin, and GitHub is
      # not reliably reachable there. Gitee keeps a source mirror and, on a `releases` branch, the
      # same `checksums.txt` — written by this run, so the two cannot drift.
      #
      # `releases` never merges with `main`, so mirroring the source cannot collide with it. A
      # rehearsal is skipped: it publishes nothing, so there is nothing to mirror.
      - name: Mirror the source and the manifest to Gitee
        if: needs.build.outputs.channel != 'test'
        env:
          GITEE_DEPLOY_KEY: ${{ secrets.GITEE_DEPLOY_KEY }}
          CHANNEL: ${{ needs.build.outputs.channel }}
        run: |
          set -euo pipefail
          if [ -z "${GITEE_DEPLOY_KEY:-}" ]; then
            echo "::error::GITEE_DEPLOY_KEY is empty — the release is live but the Gitee mirror will not be, and the install page promises it; add the secret and re-run this tag"
            exit 1
          fi
          dir="$RUNNER_TEMP/gitee"
          install -d -m 700 "$dir"
          printf '%s\n' "$GITEE_DEPLOY_KEY" > "$dir/key"
          chmod 600 "$dir/key"
          ssh-keyscan gitee.com > "$dir/known_hosts" 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i $dir/key -o IdentitiesOnly=yes -o UserKnownHostsFile=$dir/known_hosts"
          remote="git@gitee.com:skillmasterai/skillmaster-cli.git"
          identity=(-c user.name="SkillMaster Bot" -c user.email="bot@skillmasterai.com")

          # The source. Only the live channel touches `main`; a beta build is the same tree.
          if [ "$CHANNEL" = live ]; then
            git push --force "$remote" "HEAD:refs/heads/main"
          fi

          # The manifest, on the branch nobody merges.
          work="$RUNNER_TEMP/gitee-releases"
          git clone --quiet --branch releases --single-branch "$remote" "$work"
          install -d "$work/v$VERSION"
          cp dist/checksums.txt "$work/v$VERSION/checksums.txt"
          cp dist/checksums.txt.minisig "$work/v$VERSION/checksums.txt.minisig"
          cp dist/minisign.pub "$work/minisign.pub"
          git -C "$work" "${identity[@]}" add -A
          if git -C "$work" diff --cached --quiet; then
            echo "the Gitee manifest already matches this build"
          else
            git -C "$work" "${identity[@]}" commit --quiet -m "Publish the $VERSION checksums"
            git -C "$work" push --quiet origin releases
          fi

          # Read it back anonymously: the promise is a public URL, not a push that exited 0.
          url="https://gitee.com/skillmasterai/skillmaster-cli/raw/releases/v$VERSION/checksums.txt"
          got="$RUNNER_TEMP/gitee-checksums.txt"
          curl -fsSL --retry 5 --retry-delay 3 -o "$got" "$url"
          cmp "$got" dist/checksums.txt || {
            echo "::error::$url does not serve this build's checksums.txt — the install page would compare two different files"
            exit 1
          }
          echo "Gitee serves v$VERSION/checksums.txt byte for byte"

