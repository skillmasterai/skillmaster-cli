# A workflow's shell is checked by nothing until something runs it.
#
# `check-workflows.rb` runs `bash -n` over every `run:` block. The install scripts are
# checked separately because they are what a new user runs first.
name: Shell

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  syntax:
    name: Every run block and install script is valid
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: bash -n over every step
        run: ruby .github/scripts/check-workflows.rb

      - name: bash -n over the scripts
        run: |
          for script in .github/scripts/*.sh; do bash -n "$script"; done

      - name: sh -n over the installer
        run: sh -n install/install.sh

      - name: The installers never teach a removed command
        run: |
          # **The last lines a new user reads are these.** v97 removed `skmr install`; an installer
          # that still prints it hands every first-time user two commands that answer exit 2.
          if grep -nE '" (install|prompt print)( |$)|skmr (install|prompt print)( |$)' install/install.sh install/install.ps1; then
            echo "::error::an installer still prints the removed 'skmr install' command"
            exit 1
          fi

      - name: The Windows installer starts with a UTF-8 BOM
        run: |
          # **The parser below cannot see this one.** It runs under pwsh 7, which assumes UTF-8
          # whether or not a BOM is there; Windows PowerShell 5.1 does not — without the BOM it
          # decodes the script with the system ANSI codepage (GBK on a Chinese Windows), and the
          # Chinese messages arrive as mojibake. Three bytes are the whole fix, so they get a guard.
          bom="$(head -c 3 install/install.ps1 | od -An -tx1 | tr -d ' \n')"
          if [ "$bom" != "efbbbf" ]; then
            echo "::error::install/install.ps1 must start with a UTF-8 BOM (EF BB BF); found '$bom'. Windows PowerShell 5.1 will read it as ANSI (GBK) without it."
            exit 1
          fi
          echo "install/install.ps1 starts with a UTF-8 BOM"

      - name: The Windows installer parses
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            "$PWD/install/install.ps1", [ref]$null, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { $errors | ForEach-Object { Write-Error $_ }; exit 1 }
